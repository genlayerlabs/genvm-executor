# Dependency management for the genlayer-py-std unit tests moved to nix:
# executors/v0.3.x/support/nix/py-test/flake.nix provides the pytest interpreter
# (was [tool.poetry.group.dev.dependencies]), and the genlayer / genlayer_embeddings
# / onnx packages under test are imported from src/ + src-emb/ via PYTHONPATH
# (was the [tool.poetry] packages editable install). See
# tests/runner/genvm_tool_plugins/pytest.py.
#
# Only the pytest + coverage *runner* config remains here; pytest reads it from
# this file's cwd when invoked.

[tool.coverage.run]
concurrency = ["multiprocessing"]
sigterm = true

[tool.pytest.ini_options]
addopts = "--cov=genlayer.types --cov=genlayer.calldata --cov=genlayer.storage --cov=genlayer.evm --cov=genlayer._internal --cov=genlayer_embeddings --cov-report term-missing --cov-fail-under=75"
testpaths = ["tests"]
