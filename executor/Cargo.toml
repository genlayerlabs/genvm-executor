[package]
name = "genvm"
version = "0.2.0"
edition = "2021"

# Wasm compilation (`genvm precompile`, and the first run of any contract) is
# unusable when cranelift is built unoptimized: a profile of `precompile`
# attributes ~80% of its samples to the crates below, so they are optimized even
# in dev while genvm's own code stays at opt-level 0. Generic code (hashbrown,
# smallvec, core) is monomorphized into whichever crate instantiates it, so
# optimizing these covers it too.
[profile.dev.package]
cranelift-assembler-x64.opt-level = 2
cranelift-bforest.opt-level = 2
cranelift-bitset.opt-level = 2
cranelift-codegen.opt-level = 2
cranelift-control.opt-level = 2
cranelift-entity.opt-level = 2
cranelift-frontend.opt-level = 2
gimli.opt-level = 2
log.opt-level = 2
object.opt-level = 2
regalloc2.opt-level = 2
wasmparser.opt-level = 2
wasmtime.opt-level = 2
wasmtime-environ.opt-level = 2
wasmtime-internal-cranelift.opt-level = 2

[profile.dev]
incremental = false
panic = "abort"

[profile.release]
debug = true
incremental = false
panic = "abort"

[profile.dev.build-override]
debug = false
incremental = false
opt-level = 0
strip = true

[features]
# The fuzz examples link against the AFL runtime, which only `cargo-afl`
# supplies. Gate them so a plain `cargo test` skips them instead of failing.
fuzzing = []

[[example]]
name = "fuzz-genvm-storage"
path = "fuzz/genvm-storage.rs"
required-features = ["fuzzing"]

[dependencies.wasmtime]
default-features = false
features = [
    "anyhow",
    "cranelift",
    "std",
    "parallel-compilation",
    "cache",
    "demangle",
]
path = "third-party/wasmtime/crates/wasmtime"

[dependencies]
wasmparser = { path = "third-party/wasm-tools/crates/wasmparser", default-features = false, features = [
    "simd",
] }
wasmtime-cache = { path = "third-party/wasmtime/crates/cache", package = "wasmtime-internal-cache" }
wiggle = { path = "third-party/wasmtime/crates/wiggle", default-features = false, features = [
    "wasmtime_async",
] }

genvm-common = { path = "crates/common" }
# NOTE: path dependency that climbs UP into the genvm-manager umbrella repo.
# Shared, executor-free modules-interfaces + shared calldata (both manager-root).
# This line keeps its OWN sdk-rs (it carries the legacy gl_call::Message::Rollback
# variant); modules-interfaces no longer depends on sdk-rs, so there is no clash.
genlayer_calldata = { path = "crates/calldata" }
genlayer_sdk = { path = "crates/sdk-rs", default-features = false }
genvm_modules_interfaces = { path = "crates/modules-interfaces" }

anyhow = { version = "1.0.97", default-features = false }
arbitrary = { version = "1.0.3", features = ["derive"] }
archery = "1.2.2"
async-trait = "0.1.88"
base32 = "0.5.1"
base64 = "0.22.1"
bufreaderwriter = "0.2.4"
bytes = { version = "1.11.0", features = ["serde"] }
chrono = { version = "0.4.41", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
clap = { version = "4.5.35", features = ["derive"] }
const-lru = "1.0.0"
crossbeam = "0.8.4"
dashmap = "6.1.0"
futures-util = "0.3.31"
getrandom = { version = "0.3.2", default-features = false, features = ["std"] }
hex = "0.4.3"
itertools = "0.14.0"
mt19937 = "3.1.0"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-rational = { version = "0.4.2", default-features = false, features = [
    "num-bigint",
] }
once_cell = "1.21.3"
primitive-types = { version = "0.13.1", default-features = false, features = [
    "impl-serde",
    "std",
] }
rand_core = "0.9.3"
rpds = "1.2.0"
serde = { version = "1.0.219", features = ["rc"] }
serde_bytes = "0.11.17"
serde_derive = "1.0.219"
serde_json = "1.0.140"
serde_with = { version = "3.12.0", features = ["base64"] }
serde_yaml = "0.9.34"
sha2 = "0.10.8"
sha3 = { version = "0.10.8", features = ["asm"] }
symbol_table = { version = "0.4.0", features = ["global", "serde"] }
tokio = { version = "1.44.1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "sync",
    "fs",
], default-features = false }
tokio-mpmc = "0.2.4"
tokio-tungstenite = "0.26.2"
tracing = "0.1.41"
zip = "4.0.0"

[dev-dependencies]
afl = { version = "0.15.18", features = ["no_cfg_fuzzing"] }
libc = "0.2.162"
wasm-encoder = { path = "third-party/wasm-tools/crates/wasm-encoder" }
wasm-smith = { path = "third-party/wasm-tools/crates/wasm-smith", features = [
    "wasmparser",
] }
wat = { path = "third-party/wasm-tools/crates/wat" }
#wasm-encoder = { path = "third-party/wasm-tools/crates/wasm-encoder", default-features = false, features = ["wasmparser"]}
#wasmtime-fuzzing = { path = "third-party/wasmtime/crates/fuzzing", default-features = false }
