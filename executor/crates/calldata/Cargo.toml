[package]
name = "genlayer_calldata"
version = "0.0.2"
edition = "2024"
repository = "https://github.com/genlayerlabs/genvm"
description = "Crate for handling GenLayer calldata encoding and decoding"
readme = "README.md"
license-file = "LICENSE.txt"
homepage = "https://genlayer.com"
keywords = ["genlayer", "blockchain", "smart-contracts", "wasm", "wasi"]
categories = ["encoding", "parser-implementations"]
exclude = ["/tests/**", "/fuzz/**"]

[[example]]
name = "fuzz-genvm-common-decode"
path = "fuzz/genvm-common-decode.rs"
required-features = ["fuzzing"]

[[example]]
name = "fuzz-genvm-common-encode"
path = "fuzz/genvm-common-encode.rs"
required-features = ["fuzzing"]

[features]
default = []
fuzzing = ["dep:arbitrary", "dep:mutatis"]

[dependencies]
arbitrary = { version = "1.0", optional = true }
bytes = { version = "1.11.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
genlayer_calldata_derive = { path = "../calldata-derive" }
hex = "0.4.3"
num-bigint = { version = "0.4.6", features = ["serde"] }
primitive-types = { version = "0.13", features = ["impl-serde"] }
serde = { version = "1.0", features = ["derive"] }
sha3 = { version = "0.10" }

[dev-dependencies]
afl = { version = "0.15.18", features = ["no_cfg_fuzzing"] }
genvm-fuzzing = { path = "../../../../../crates/fuzzing" }
hex = "0.4.3"

[dependencies.mutatis]
default-features = false
features = ["derive", "std"]
optional = true
version = "0.5.3"
