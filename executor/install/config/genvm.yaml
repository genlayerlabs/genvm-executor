# yaml-language-server: $schema=../../../doc/schemas/default-config.json#genvm
# yaml-language-server: $schema=https://raw.githubusercontent.com/genlayerlabs/genvm/refs/heads/main/doc/schemas/default-config.json#genvm
modules:
  llm:
    address: ws://127.0.0.1:3031
  web:
    address: ws://127.0.0.1:3032

log_level: info

fees:
  # Host buckets (bucket_totals supplied by node/consensus):
  #   execution_data_gas - shared by storage, message_receipt, nondet_output and event
  #   message_fee - outbound message fee budget
  #   nondet_outputs - byte cap enforced via nondet_output
  #   submitted_messages - byte cap enforced via message_receipt
  #   submitted_messages_count - message count cap enforced via message_receipt
  #
  #
  # Required host-provided `node` fields (from gas_data):
  #   node.storageUnitPrice            - price per storage page
  #   node.receiptGasPerByte           - price per receipt/output byte
  #   node.gasPerChangedSlot           - price per changed storage slot
  #   node.intrinsicGas                - per-tx intrinsic gas
  #   node.bootloaderOverhead          - per-tx bootloader overhead
  #   node.fixedProposeReceiptGas      - fixed cost of a propose receipt
  #   node.fixedMessageRevealGas       - fixed cost of a message reveal
  #   node.lockedReceiptGasPrice       - transaction's locked receipt gas price
  #   node.overlaySplitBps             - combined developer + DAO share of the
  #                                      time-unit fee pool, in basis points
  #   node.receiptWrapperBytes         - propose-receipt wrapper byte allowance
  #   node.minProposeTimeout           - minimum leader timeunits allocation
  #   node.maxProposeTimeout           - maximum leader timeunits allocation
  #   node.minCommitTimeout            - minimum validator timeunits allocation
  #   node.maxCommitTimeout            - maximum validator timeunits allocation
  # Optional:
  #   node.validatorsPerRound[]        - validator count per round
  #                                      (defaults to defaultValidatorsPerRound below)
  #   node.messageBudgetFloor          - minimum non-zero per-round execution
  #                                      budget a balance-funded internal message
  #                                      may declare; the chain reverts
  #                                      `BudgetTooLow` below it. A message whose
  #                                      executionBudgetPerRound is in (0, floor)
  #                                      is rejected at emission with
  #                                      `fee below_minimum`
  #                                      (defaults to 0 = no floor)
  #
  # GenVM consumption points can consume multiple buckets, but as a fee only first is reported to the node
  #   i.e. message_receipt consumes from execution_data_gas and both submitted message caps
  #   to message only execution_data_gas gets attached
  expr_prelude: |
    let Y = \f = (\x = f (\v = x x v)) (\x = f (\v = x x v)) in
    let fold = \arr acc fn =
        Y (\go i a =
            if i >= arrayLen arr then a
            else go (i + 1) (fn a (arrayGetElem arr i))
        ) 0 acc in
    let foldRange = \lo hi acc fn =
        Y (\go i a =
            if i >= hi then a
            else go (i + 1) (fn a i)
        ) lo acc in
    let ceilDiv = \a b = floor ((a + b - 1) / b) in
    let idiv = \a b = floor (a / b) in

    let u256Max = pow 2 256 - 1 in

    # validators per round; falls back to the governance default table when
    # the node does not provide node.validatorsPerRound
    let defaultValidatorsPerRound =
      [5, 7, 11, 13, 23, 25, 47, 49, 95, 97, 191, 193, 383, 385, 767, 769, 1535, 1537] in
    let validatorsPerRound =
      if hasKey node "validatorsPerRound" then node.validatorsPerRound
      else defaultValidatorsPerRound in
    # leaf-node message fee floor = minPrimaryFees
    # feeParams: object { leaderTimeunitsAllocation,
    #   validatorTimeunitsAllocation, executionBudgetPerRound, rotations[],
    #   maxPriceGenPerTimeUnit }
    # appealRounds = len(rotations) - 1
    # uses validatorsPerRound[] (node or default) and maxPriceGenPerTimeUnit as
    # the consensus-term multiplier.
    let messageFeeFloor = \feeParams =
      let rotations = feeParams.rotations in
      let appealRounds = arrayLen rotations - 1 in
      # rounds span 0 .. 2*appealRounds and index validatorsPerRound[round]; a
      # message with more appeal rounds than the validator table supports would
      # overrun the array (internal abort). The bound is node-config-dependent,
      # so it is enforced here rather than in the SDK. On-chain such a message
      # exceeds MAX_ROUNDS.
      if 2 * appealRounds >= arrayLen validatorsPerRound then vmError "fee too_many_rounds"
      else
      let leaderTU = feeParams.leaderTimeunitsAllocation in
      let validatorTU = feeParams.validatorTimeunitsAllocation in
      let execBudgetPerRound = feeParams.executionBudgetPerRound in
      # round parity: odd when round - 2*(round/2) == 1
      let isOdd = \n = n - 2 * idiv n 2 == 1 in
      # 1. rotation count per round
      let rotationsForRound = \round =
        if round == 0 then arrayGetElem rotations 0 + 1
        else if isOdd round then 1
        else arrayGetElem rotations (idiv round 2) + 1 in
      # 2. consensus (time) term, round = 0 .. 2*appealRounds
      let consensusTerm = foldRange 0 (2 * appealRounds + 1) 0 (\acc round =
        acc + rotationsForRound round
            * (leaderTU + arrayGetElem validatorsPerRound round * validatorTU)) in
      # 3. leader rounds = (Σ i=0..appealRounds (rotations[i]+1)) + appealRounds
      let leaderRounds =
        foldRange 0 (appealRounds + 1) 0 (\acc i = acc + arrayGetElem rotations i + 1)
          + appealRounds in
      # 4. execution-budget term
      let executionTerm = execBudgetPerRound * leaderRounds in
      # 5. consensus-term multiplier: the chain's `_calculateRoundFees` charges
      #    the consensus term at maxPriceGenPerTimeUnit (the funding cap) on
      #    every path. Storage/receipt caps stay out of the floor:
      #    `feeParamsToFeesDistribution` zeroes them so their revert-on-exceed
      #    guards never fire during this calc.
      let multiplier = feeParams.maxPriceGenPerTimeUnit in
      # 6. time-unit pool and developer + DAO overlay. The overlay is grossed
      #    up on the time-unit pool only; integer division matches Solidity
      let timeUnitPool =
        if multiplier > 0 then multiplier * consensusTerm else consensusTerm in
      # the overlay is a share of the gross pool, so bps must stay below 100%;
      # at or above it the gross-up denominator is zero or negative, which would
      # silently underprice the message instead of failing
      if node.overlaySplitBps >= 10000
      then internalError "node.overlaySplitBps must be below 10000"
      else
      let overlaySplit =
        idiv (timeUnitPool * node.overlaySplitBps) (10000 - node.overlaySplitBps) in
      # 7. minimum primary fees
      let minPrimaryFees = timeUnitPool + overlaySplit + executionTerm in
      minPrimaryFees
    in
  storage:
    buckets: execution_data_gas
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a = a.pages * node.storageUnitPrice
  message_receipt:
    # Gas cost and conservative ABI byte size of this SubmittedMessage
    buckets: [execution_data_gas, submitted_messages, submitted_messages_count]
    subtract_on_start_expr: |
      [ # execution_data_gas
        node.fixedProposeReceiptGas # for propose
        + node.intrinsicGas
        + node.bootloaderOverhead
        + 7 * node.gasPerChangedSlot
      # submitted_messages
      , 0
      # submitted_messages_count
      , 0
      ]
    delta_expr: |
      \a =
      let revealGas = if a.isFirstMessage then
        node.fixedMessageRevealGas
        + node.intrinsicGas
        + node.bootloaderOverhead
        + 64 * node.receiptGasPerByte # outer offset and array length
        else 0 in
      let revealBytes = if a.isFirstMessage then 64 else 0 in
      # 32-byte element offset plus the 11-word SubmittedMessage head
      let fixedBytes = 32 + 11 * 32 in
      # Each `bytes` field is length + data, rounded up to 32 bytes. The extra
      # calldata word conservatively covers the internal RLP wrapper
      let calldataBytes = 32 + 32 + ceilDiv a.calldataLength 32 * 32 in
      # allocationSubtree is empty for external and balance-funded messages
      let subtreeBytes = 32 + 32 + ceilDiv a.subtreeLength 32 * 32 in
      # Internal fee params have an outer offset, 8-word head, and rotations
      # array; external fee params are a static 2-word tuple
      let feeParamsLength = if a.isInternal then 32 + 8 * 32 + 32 + 32 * a.rotationsCount else 2 * 32 in
      let feeParamsBytes = 32 + ceilDiv feeParamsLength 32 * 32 in
      # Deploy code shares the internal RLP data field; charging it separately
      # is conservative and avoids depending on RLP prefix lengths
      let codeBytes = if a.isDeploy then 32 + 32 + ceilDiv a.codeLength 32 * 32 else 0 in
      let abiBytes = fixedBytes + calldataBytes + feeParamsBytes + subtreeBytes + codeBytes in
      [ # execution_data_gas
        revealGas + abiBytes * node.receiptGasPerByte + node.gasPerChangedSlot
      # submitted_messages
      , revealBytes + abiBytes
      # submitted_messages_count
      , 1]
  nondet_output:
    # Gas cost and conservative compact LeaderPublicData size
    buckets: [execution_data_gas, nondet_outputs]
    subtract_on_start_expr: |
      # Conservative fixed allowance for the LeaderPublicData envelope
      let nondet_outputs_header_bytes = 64 in
      [ # execution_data_gas
        (node.receiptWrapperBytes + nondet_outputs_header_bytes) * node.receiptGasPerByte
      # nondet_outputs
      , nondet_outputs_header_bytes
      ]
    delta_expr: |
      \a =
      # Raw output bytes plus conservative compact-encoding overhead
      let encodedBytes = 5 + a.outputLength in
      [ # execution_data_gas
        encodedBytes * node.receiptGasPerByte
      # nondet_outputs
      , encodedBytes
      ]
  message_fee:
    buckets: message_fee
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a =
      # `a.matchedFeeParams` is shaped by the branch: internal params here,
      # `{gasLimit, maxGasPrice}` on the external one. The bindings below read
      # internal-only keys and stay correct because `let` is call-by-need --
      # the external branch never forces them. Do not hoist them past the `if`.
      # Both-zero is the chain's explicit phase-timeout opt-out. Otherwise each
      # allocation must fit its phase's current Idleness bounds or child creation
      # reverts PhaseTimeoutOutOfBounds.
      let leaderTimeUnits = a.matchedFeeParams.leaderTimeunitsAllocation in
      let validatorTimeUnits = a.matchedFeeParams.validatorTimeunitsAllocation in
      let phaseTimeoutsDisabled =
        if leaderTimeUnits == 0 then validatorTimeUnits == 0 else false in
      let phaseTimeoutsOutOfBounds =
        if phaseTimeoutsDisabled then false
        else if leaderTimeUnits < node.minProposeTimeout then true
        else if leaderTimeUnits > node.maxProposeTimeout then true
        else if validatorTimeUnits < node.minCommitTimeout then true
        else validatorTimeUnits > node.maxCommitTimeout in
      # a non-zero per-round budget below the node floor reverts `BudgetTooLow`
      # at reveal on-chain; reject it at emission instead. Absent constant => no
      # floor.
      let budgetFloor = if hasKey node "messageBudgetFloor" then node.messageBudgetFloor else 0 in
      # reject only a non-zero per-round budget below the floor (matches the
      # chain's `execBudget > 0 && execBudget < floor`)
      let budgetTooLow =
        if a.matchedFeeParams.executionBudgetPerRound > 0
        then a.matchedFeeParams.executionBudgetPerRound < budgetFloor
        else false in
      if a.isInternal
      then
        if phaseTimeoutsOutOfBounds then vmError "fee below_minimum"
        else if budgetTooLow then vmError "fee below_minimum"
        else messageFeeFloor a.matchedFeeParams
      # external messages reserve gasLimit at the effective chain price
      else a.matchedFeeParams.gasLimit
        * (if node.lockedReceiptGasPrice < a.matchedFeeParams.maxGasPrice
           then node.lockedReceiptGasPrice
           else a.matchedFeeParams.maxGasPrice)
  event:
    buckets: execution_data_gas
    subtract_on_start_expr: |
      0
    delta_expr: |
      \a = (a.topicsCount + ceilDiv a.blobSize 32) * node.storageUnitPrice

threads: 2
blocking_threads: 4
log_disable: genvm::rt::memlimiter

cache_dir: ${exeDir}/../.cache/
runners_dir: ${exeDir}/../../../runners/
registry_dir: ${exeDir}/../data
