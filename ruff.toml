exclude = ["runners/genlayer-py-std/src-emb/onnx", "runners/py-libs/**/*"]
# The hook passes an explicit file list; ruff only honors `exclude` for
# explicitly-named files when force-exclude is set (otherwise exclude applies
# only to directory discovery, and vendored/generated files get reformatted).
force-exclude = true
indent-width = 2

[format]
indent-style = "tab"
line-ending = "lf"
quote-style = "single"

docstring-code-format = true
skip-magic-trailing-comma = false

[lint]
ignore = ["E741"]

extend-select = [
    "E9",
    "F",
    "ASYNC",
    "RUF006",
    "D213", # docstring summary on next line
    "I", # sort imports
]

exclude = ["runners/cpython/modules/**"]
