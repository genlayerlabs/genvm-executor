reviews:
  # Auto-review PRs targeting any long-lived branch: main, a release branch
  # (v0.3.x) or its dev branch (v0.3-dev). Feature/topic branches are reviewed
  # through the base they target. Patterns are regexes; keep them free of
  # optional groups, an `(\.x|-dev)?` suffix here did not match `v0.3-dev`.
  base_branches:
    - "main"
    - "v\\d+\\.\\d+"
    - "v\\d+\\.\\d+\\.x"
    - "v\\d+\\.\\d+-dev"
  path_filters:
    - "!**/*.onnx"
    - "!**/*.txt"
    - "!**/*.stdout"
    - "!**/*.hash"
    - "!**/*.lock"
    - "!runners/py-libs/pure-py/**"
    - "!runners/models/**"
    - "!runners/softfloat/berkeley-softfloat-3/**"
    - "!executor/third-party/**"
    - "!**/fuzz/inputs*/**"
    # Root-level system-test fixtures (contracts, expected outputs); crate and
    # runner test code under */tests/ is still reviewed.
    - "!tests/**"
